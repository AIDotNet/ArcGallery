name: CI

# verify: builds the gallery and runs its tests (Linux) on pushes to main and on pull requests. The libraries are TKCode.Arc's:
# its main branch (or the arc_ref of a manual run) is checked out into ./arc, where Directory.Build.props finds it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      arc_ref:
        description: TKCode.Arc branch, tag or commit to build against (empty = main)
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build and test (ubuntu-latest)
    runs-on: ubuntu-latest
    # About 10 minutes of build and 30 or more of the headless tests.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: AIDotNet/TKCode.Arc
          ref: ${{ inputs.arc_ref || 'main' }}
          path: arc

      - uses: actions/setup-dotnet@v6
        with:
          # global.json pins the .NET 11 SDK; the test project runs on .NET 10.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'arc/Directory.Packages.props', 'arc/build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build ArcGallery.slnx

      - name: Test (gallery, headless Avalonia)
        run: dotnet test tests/TKCode.Arc.Gallery.Tests --no-build
