name: Gallery (Windows & Linux)

# Builds the Gallery desktop app for Windows and Linux. Neither is signed.
#   - push of a v* tag:                       the files are attached to the GitHub release of that tag
#   - workflow_dispatch with a tag:           builds that tag and attaches the files to its existing release
#   - workflow_dispatch without a tag, and
#     pull_request touching this file:        dry run, files stay workflow artifacts
# macOS (signed and notarized) is gallery-macos.yml; both workflows add to the same release of this repository (the libraries are
# TKCode.Arc's: tag both repositories with the same v* version).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the files to (empty = dry run); TKCode.Arc is checked out at the same tag
        type: string
        default: ""
      arc_ref:
        description: TKCode.Arc branch, tag or commit to build against (empty = the tag above, else main)
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/gallery-desktop.yml
      - gallery/TKCode.Arc.Gallery.Desktop/**

concurrency:
  group: gallery-desktop-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          # Empty on tag pushes and pull requests, which build the ref that triggered the run.
          ref: ${{ inputs.tag }}

      # The libraries the gallery builds against; Directory.Build.props picks up ./arc. A tag build uses the TKCode.Arc tag of
      # the same name, anything else main (or the arc_ref of a manual run).
      - uses: actions/checkout@v7
        with:
          repository: AIDotNet/TKCode.Arc
          ref: ${{ inputs.arc_ref || inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'main' }}
          path: arc

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Install Native AOT toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'arc/Directory.Packages.props', 'arc/build/Versions.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Read version
        id: version
        run: |
          version="$(sed -n 's:.*<ArcVersion>\(.*\)</ArcVersion>.*:\1:p' arc/build/Versions.props)"
          if [[ -z "$version" ]]; then
            echo "::error::ArcVersion not found in arc/build/Versions.props"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish Native AOT
        run: >
          dotnet publish gallery/TKCode.Arc.Gallery.Desktop
          -c Release -f net10.0 -r ${{ matrix.rid }}
          --self-contained true -p:PublishAot=true -p:CopyOutputSymbolsToPublishDirectory=false
          -o publish/${{ matrix.rid }}

      # Keep the runtime's native libraries next to the AOT executable, in the layout dotnet publish produced.
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "publish/$env:RID/*" -DestinationPath "dist/TKCode.Arc.Gallery-$($env:VERSION)-$($env:RID).zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          chmod +x "publish/$RID/TKCode.Arc.Gallery.Desktop"
          tar -czf "dist/TKCode.Arc.Gallery-$VERSION-$RID.tar.gz" -C "publish/$RID" .

      - uses: actions/upload-artifact@v7
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gallery-desktop-*
          merge-multiple: true
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # gallery-macos.yml may create the release at the same time: create it, or add to it if it exists.
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes $prerelease \
              || gh release upload "$TAG" dist/* --clobber
          fi
