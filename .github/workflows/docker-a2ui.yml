name: Docker A2UI Chat

# Builds the A2UI Chat WebAssembly host (a2ui/Dockerfile, the site for a2ui.tkcode.si) when a2ui/ changes and pushes the image to
# GHCR. TKCode.Arc is checked out into ./arc, as for the gallery image. Pull requests are built but not pushed.
# Image: ghcr.io/aidotnet/a2ui-chat.

on:
  push:
    paths: ["a2ui/**", ".github/workflows/docker-a2ui.yml", "Directory.Build.props", "Directory.Packages.props", "global.json"]
  pull_request:
    paths: ["a2ui/**", ".github/workflows/docker-a2ui.yml"]
  workflow_dispatch:
    inputs:
      arc_ref:
        description: TKCode.Arc branch, tag or commit to build against (empty = main)
        type: string
        default: ""

concurrency:
  group: docker-a2ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    name: Build and push the A2UI Chat image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The libraries the gallery builds against (Directory.Build.props and the Dockerfile use ./arc).
      - uses: actions/checkout@v4
        with:
          repository: AIDotNet/TKCode.Arc
          ref: ${{ inputs.arc_ref || 'main' }}
          path: arc

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aidotnet/a2ui-chat
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./a2ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the image that was just pushed and checks what matters to the browser: brotli and long-lived caching for the
  # fingerprinted WebAssembly, gzip and revalidation for the files that keep their names across deploys (avalonia.js,
  # the Chinese font, index.html), the Content-Security-Policy with the import map's hash filled in, and the fallback
  # to index.html for the app's own routes.
  smoke:
    name: Check the pushed image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the image
        run: |
          IMAGE="ghcr.io/aidotnet/a2ui-chat:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name a2ui -p 8080:80 "$IMAGE"
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          WASM=$(docker exec a2ui sh -c 'cd /usr/share/nginx/html/_framework && ls *.wasm | grep -E "\.[0-9a-z]{8,}\.wasm$" | head -1')
          echo "fingerprinted wasm: $WASM"
          curl -sfI -H 'Accept-Encoding: br' "http://127.0.0.1:8080/_framework/$WASM" | tee wasm.headers
          grep -qi '^content-encoding: br' wasm.headers
          grep -qi '^cache-control: public, max-age=31536000, immutable' wasm.headers
          grep -qi '^content-type: application/wasm' wasm.headers
          curl -sfI -H 'Accept-Encoding: gzip' http://127.0.0.1:8080/_framework/avalonia.js | tee js.headers
          grep -qi '^content-encoding: gzip' js.headers
          grep -qi '^cache-control: no-cache' js.headers
          curl -sfI http://127.0.0.1:8080/ | tee index.headers
          grep -qi '^cache-control: no-cache' index.headers
          grep -qi "^content-security-policy: .*script-src 'self' 'wasm-unsafe-eval' 'sha256-" index.headers
          if grep -q '__IMPORTMAP_HASH__' index.headers; then exit 1; fi
          curl -sfI http://127.0.0.1:8080/fonts/NotoSansSC-Subset.otf | tee font.headers
          grep -qi '^cache-control: no-cache' font.headers
          curl -sf http://127.0.0.1:8080/some/app/route | grep -q '<title>A2UI Chat</title>'

      - name: Logs on failure
        if: failure()
        run: docker logs a2ui || true
