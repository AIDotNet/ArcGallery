# A2UI Chat WebAssembly host (a2ui.tkcode.si). Files are pre-compressed at build time (*.br, *.gz), served by brotli_static /
# gzip_static. The site is static: model requests go from the visitor's browser straight to the provider they configure.
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml text/plain application/xml;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/headers.conf;

        location ~* "^/_framework/.+\.[0-9a-z]{8,}\.(js|wasm|dat|json|dll|pdb|css|map)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            include /etc/nginx/headers.conf;
            try_files $uri =404;
        }

        location /_framework/ {
            add_header Cache-Control "no-cache";
            include /etc/nginx/headers.conf;
            try_files $uri =404;
        }

        location ~* \.(png|webp|ico|jpg|jpeg|gif|woff2|svg)$ {
            add_header Cache-Control "public, max-age=86400";
            include /etc/nginx/headers.conf;
            try_files $uri =404;
        }

        # The app has client-side addresses only: everything else is index.html, always revalidated.
        location / {
            add_header Cache-Control "no-cache";
            include /etc/nginx/headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
