# Response headers of every location (nginx drops server-level add_header lines in a location that adds its own, so each
# location includes this file). The policy: requests go from the browser straight to the provider the visitor configures,
# so connect-src allows any https host and this machine (local models); nothing else is loaded from other origins.
# __IMPORTMAP_HASH__ is replaced at image build with the hash of index.html's generated import map (an inline script whose
# file names change with every build), see a2ui/Dockerfile.
add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; img-src 'self' https: data: blob:; media-src 'self' https:; script-src 'self' 'wasm-unsafe-eval' '__IMPORTMAP_HASH__'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
